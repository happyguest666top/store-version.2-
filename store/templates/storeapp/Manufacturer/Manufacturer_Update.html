{% extends "base.html" %}
{% load static %}

{% block title %}Редагувати Виробника | SHOP{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <h3 class="fw-bold mb-4 text-dark">
                    <i class="bi bi-pencil-square me-2"></i>Редагувати виробника
                </h3>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-medium text-secondary">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-dark rounded-pill px-4">Зберегти зміни</button>
                        <a href="{% url 'storeapp:manufacturer_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Скасувати</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input, select, textarea').forEach(function(el) {
        if (el.type !== 'checkbox') {
            el.classList.add('form-control', 'rounded-3');
        } else {
            el.classList.add('form-check-input');
        }
    });
</script>
{% endblock %}
