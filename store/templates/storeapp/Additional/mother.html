<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fce4ec;
            font-family: 'Arial', sans-serif;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .photo-placeholder {
            width: 200px;
            height: 200px;
            background-color: #ffcdd2;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
        }
        h1 { color: #d81b60; }
        p { line-height: 1.6; color: #4a148c; font-size: 18px; }
        .footer { font-weight: bold; margin-top: 20px; color: #d81b60; }
    </style>
</head>
<body>

<div class="card">
    <div class="photo-placeholder">❤️</div>
    <h1>Привіт, мамо!</h1>
    <p>
        Вітаю тебе з днем народження! Дякую, що ти зі мною всі ці 15 років.
        Дякую, що ти мене підтримуєш, любиш і допомагаєш.
        Бажаю тобі, щоб ти так і залишалася веселою, життєрадісною і доброю — ніколи не загуби ці якості.
    </p>
    <p class="footer">Як ти мені говорила: 22 на 2!</p>
</div>

</body>
</html>
